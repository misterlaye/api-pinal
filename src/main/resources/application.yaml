spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: api-pinal

  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/pinal_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Une base ayant déjà chargé le jeu de démonstration (migration répétable du profil "demo")
    # doit pouvoir redémarrer sans ce profil. Seules les migrations répétables absentes sont tolérées :
    # une migration versionnée manquante fait toujours échouer la validation.
    ignore-migration-patterns: "repeatable:missing"


# Seuls health (public) et info (authentifié) sont exposés.
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

pinal:
  ai-copilot:
    enabled: ${AI_COPILOT_ENABLED:false}
    llm:
      api-key: ${GEMINI_API_KEY:}
      endpoint: ${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      prompt-version: ${AI_COPILOT_PROMPT_VERSION:v1}
      output-schema-version: v1
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900
    refresh-token-expiration: 604800
  otp:
    expiration: 300
    max-attempts: 5
    code-length: 6
  pin:
    # Échecs consécutifs avant verrouillage du PIN, puis durée du verrouillage (ISO-8601).
    max-attempts: 5
    lock-duration: PT15M
  security:
    auth-rate-limit:
      # Appels maximum par minute, par adresse cliente et par endpoint /api/v1/auth/** (0 = désactivé).
      requests-per-minute: 20


