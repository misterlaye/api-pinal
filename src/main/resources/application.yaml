spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: api-pinal

  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/pinal_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  management:
    endpoints:
      web:
        exposure:
          include:
            - health
            - info
            - flyway

pinal:
  ai-copilot:
    enabled: ${AI_COPILOT_ENABLED:false}
    llm:
      api-key: ${GEMINI_API_KEY:}
      endpoint: ${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      prompt-version: ${AI_COPILOT_PROMPT_VERSION:v1}
      output-schema-version: v1
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900
    refresh-token-expiration: 604800
  otp:
    expiration: 300
    max-attempts: 5
    code-length: 6

finance:
  lait:
    # Hypothèse métier de conversion : Densité moyenne du lait de vache (1.03 kg/L).
    # Formule : Volume (Litres) = Masse (kg) * (1 / 1.03) = Masse * 0.971
    # Ce paramètre définit explicitement le multiplicateur pour convertir des kg en litres.
    litres-par-kg: 0.971

