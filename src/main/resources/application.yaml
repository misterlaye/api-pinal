spring:
  application:
    name: api-pinal

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/pinal_db
    username: pinal
    password: passer123

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  management:
    endpoints:
      web:
        exposure:
          include:
            - health
            - info
            - flyway

pinal:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-for-development-only-min-32-chars!!}
    access-token-expiration: 900
    refresh-token-expiration: 604800
  otp:
    expiration: 300
    max-attempts: 5
    code-length: 6
